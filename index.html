<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Kepuasan Dealer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

  <style>
    :root {
      --csl-red:#E60012;
      --csl-red-dark:#C8102E;
      --csl-orange:#FF6B00;
      --csl-yellow:#FFB000;
      --csl-green:#35A853;
      --csl-blue:#1665D8;
      --csl-text:#262626;
      --csl-muted:#666;
      --csl-border:#E7E9EC;
      --csl-shadow:0 1px 2px rgba(20,20,20,.04),0 2px 8px rgba(20,20,20,.05);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--csl-text)}
    body{background:linear-gradient(180deg,#FF6B00 0%,#FF8A33 420px,#FFF7F2 100%);background-attachment:fixed}
    button,select{font:inherit}
    .app-container{max-width:1600px;margin:0 auto;padding:.25rem 1.25rem 3rem}

    /* ===== HEADER ===== */
    .top-header{display:grid;grid-template-columns:6.8fr 1.55fr 1.15fr 1.05fr;align-items:center;gap:10px;margin:0 0 10px;padding:14px 20px;border-radius:10px;background:linear-gradient(110deg,#C8102E 0%,#E60012 43%,#FF6B00 100%);box-shadow:0 4px 16px rgba(200,16,46,.28);color:#fff}
    .csl-header-brand{display:flex;align-items:center;justify-content:flex-start;gap:12px;height:44px;margin:0;padding:0;min-width:0}
    .csl-logo{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:#fff;color:#C8102E;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;font-weight:800}
    .csl-brand{display:flex;align-items:center;justify-content:flex-start;height:40px;gap:12px;min-width:0}
    .csl-brand h1{display:flex;align-items:center;height:40px;font-size:18px;line-height:1;margin:0;padding:0;color:#fff;font-weight:800;letter-spacing:.2px;white-space:nowrap}
    .csl-update-time{position:relative;left:8px;font-size:11px;line-height:1.25;text-align:right;color:rgba(255,255,255,.92);white-space:nowrap}
    .csl-update-time b{color:#fff;font-size:11.5px}
    .header-btn{min-height:34px;height:34px;width:100%;padding:0 14px;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.72);border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:none;cursor:pointer}
    .header-btn:hover{color:#C8102E;background:#fff;border-color:#fff}

    /* ===== NAV ===== */
    .page-selector-card{display:block;width:100%;background:transparent;border:0;padding:0;margin:0 0 12px}
    .page-selector{display:flex;gap:7px;flex-wrap:wrap}
    .page-btn{min-height:40px;height:40px;padding:0 21px;background:#fff;border:1px solid #E2E2E2;border-radius:9px;color:#4F4F4F;font-size:12.5px;font-weight:700;box-shadow:0 2px 5px rgba(38,38,38,.10);cursor:pointer;transition:border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
    .page-btn.active{background:#fff;border:2px solid #E60012;color:#E60012;box-shadow:0 2px 7px rgba(230,0,18,.16)}
    .page-btn:not(.active):hover{background:#FFF7F7;color:#C8102E;border-color:#E60012;box-shadow:0 3px 8px rgba(200,16,46,.16)}

    /* ===== GENERAL SECTION/CARD ===== */
    .section{background:rgba(255,255,255,.98);border:1px solid var(--csl-border);border-radius:10px;box-shadow:var(--csl-shadow);padding:16px;margin:0 0 18px}
    .custom-section-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .custom-section-badge{display:flex;align-items:center;justify-content:center;width:auto;min-width:72px;height:24px;padding:0 10px;border-radius:5px;background:#E60012;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.6px}
    .section-2 .custom-section-badge{background:#FF6B00}
    .section-3 .custom-section-badge{background:#1665D8}
    .section-4 .custom-section-badge{background:#1665D8}
    .custom-section-text{font-size:15px;color:#262626;font-weight:800;letter-spacing:.1px}
    .section-description{font-size:13px;line-height:1.55;color:#404040;margin:0 0 14px}
    .chart-card,.profile-equal-card,.demographic-card,.fixed-chart-card,.nps-card,.region-card{background:#fff;border:1px solid #D0D0D0;border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.05);min-width:0}
    .chart-title{font-size:12px;font-weight:800;color:#666;letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px}
    .chart-subtitle{font-size:11.5px;color:#666;margin-bottom:8px;line-height:1.45}
    .plot{width:100%;min-width:0}
    .plot-scroll{overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}
    .plot-scroll::-webkit-scrollbar,.heatmap-scroll::-webkit-scrollbar,.profile-scroll::-webkit-scrollbar{width:7px;height:7px}
    .plot-scroll::-webkit-scrollbar-thumb,.heatmap-scroll::-webkit-scrollbar-thumb,.profile-scroll::-webkit-scrollbar-thumb{background:#D8DBDF;border-radius:20px}
    .info-box,.warning-box,.error-box{padding:11px 13px;border-radius:8px;font-size:12.5px;line-height:1.5;margin:8px 0}
    .info-box{background:#F4F8FB;border:1px solid #BBDEFB;color:#37474F}
    .warning-box{background:#FFF8E8;border:1px solid #FCE7B8;color:#6D4C00}
    .error-box{background:#FFF1F1;border:1px solid #FFD8D8;color:#9B1C1C}

    /* ===== MAP ===== */
    .map-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}
    .map-header-title{font-size:12px;font-weight:800;color:#666;text-transform:uppercase;letter-spacing:.3px}
    .map-header-badge{font-size:10.5px;font-weight:700;color:#C8102E;background:#FFF1F1;border:1px solid #FFD8D8;padding:4px 9px;border-radius:20px}
    .map-wrap{position:relative;width:100%;height:560px;border-radius:8px;overflow:hidden;background:#E9EEF2}
    #satisfaction-map{width:100%;height:560px}
    .leaflet-tile-pane{filter:grayscale(100%) brightness(1.08) contrast(.82);opacity:.62}
    .map-region-label{width:100px;text-align:center;font:500 11px Arial;color:#184C7A;white-space:nowrap;pointer-events:none;text-shadow:-1px -1px #fff,1px -1px #fff,-1px 1px #fff,1px 1px #fff}
    .map-legend{position:absolute;left:60px;bottom:18px;z-index:9998;background:rgba(255,255,255,.96);border:1px solid #D9DEE5;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:9px 12px;font:12px Arial;color:#475569}
    .map-legend-gradient{width:210px;height:10px;border-radius:5px;background:linear-gradient(90deg,#E60012 0%,#FFB000 50%,#35A853 100%)}
    .map-legend-row{display:flex;justify-content:space-between;margin-top:3px;gap:16px}
    .ntt-inset{position:absolute;right:14px;bottom:18px;width:29%;min-width:255px;max-width:330px;height:198px;z-index:9999;border:3px solid #fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);overflow:hidden;background:#E9EEF2;padding:0;cursor:pointer}
    .ntt-inset-label{position:absolute;left:10px;top:8px;z-index:2;background:rgba(255,255,255,.95);padding:4px 8px;border-radius:5px;font:700 11px Arial;color:#262626}
    .ntt-inset svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:176px;background:#E9EEF2;pointer-events:none}

    /* ===== FILTERS ===== */
    .filters-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.3fr 1.3fr 2.1fr;gap:10px;align-items:end}
    .filter-field{min-width:0}
    .filter-field label{display:block;font-size:10px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.4px;margin:0 0 5px}
    .filter-field select{width:100%;height:38px;border:1px solid var(--csl-border);border-radius:7px;background:#fff;color:#262626;padding:0 9px;font-size:12px;outline:none;min-width:0}
    .filter-field select:focus{border-color:#E60012;box-shadow:0 0 0 2px rgba(230,0,18,.08)}

    /* ===== KPI ===== */
    .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .kpi-card{min-height:132px;text-align:left;background:#fff;border:1px solid var(--csl-border);border-radius:10px;padding:16px;box-shadow:var(--csl-shadow);position:relative;overflow:hidden}
    .kpi-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#E60012}
    .kpi-label{font-size:11px;color:#666;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
    .kpi-value{font-size:34px;color:#262626;font-weight:800;line-height:1.1;margin:8px 0 4px}
    .kpi-sub{display:inline-block;font-size:10.5px;font-weight:800;background:#F0F1F3;padding:3px 9px;border-radius:20px}
    .charts-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .charts-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

    /* ===== RANKING ===== */
    .ranking-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .dealer-ranking-card{background:#fff;border:1.5px solid #D9DDE3;border-radius:12px;padding:0;overflow:hidden;box-shadow:0 2px 7px rgba(38,38,38,.07);margin:0}
    .dealer-ranking-title{padding:11px 14px 11px 16px;font-size:12px;font-weight:800;color:#262626;border-bottom:1px solid #F0F1F3;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .dealer-ranking-title-high{border-left:4px solid #FF6B00}.dealer-ranking-title-low{border-left:4px solid #E60012}
    .dealer-ranking-row{min-height:42px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px dashed #E7E9EC;transition:background-color .15s ease}
    .dealer-ranking-row:last-child{border-bottom:none}.dealer-ranking-name{font-size:12.5px;font-weight:500;line-height:1.35;color:#3F3F46;display:flex;align-items:center;gap:6px;min-width:0}.dealer-rank{font-size:11.5px;font-weight:800;color:#D75B00}.dealer-rank-low{color:#C8102E}.dealer-ranking-value{font-size:12px;font-weight:800;color:#D75B00;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}.dealer-ranking-value-low{color:#C8102E}
    .dealer-ranking-row.clickable{cursor:pointer}
    .dealer-ranking-row.clickable:hover{background:#FFF8F3}
    .dealer-ranking-row.clickable.low-row:hover{background:#FFF5F5}
    .dealer-ranking-row.active-dealer{background:#FFF1E6;border-left:3px solid #FF6B00}
    .dealer-ranking-row.active-dealer.low-row{background:#FFEFEF;border-left:3px solid #E60012}
    .dealer-ranking-row .dealer-click-hint{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:#F2F4F7;color:#475467;opacity:0;transition:opacity .15s ease;white-space:nowrap}
    .dealer-ranking-row.clickable:hover .dealer-click-hint{opacity:1;background:#FF6B00;color:#fff}
    .dealer-ranking-row.clickable.low-row:hover .dealer-click-hint{background:#E60012;color:#fff}
    .dealer-ranking-row.active-dealer .dealer-click-hint{opacity:1;background:#262626;color:#fff}
    .dealer-focus-banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,#FFF5EE 0%,#FFFFFF 100%);border:1px solid #FFD6B8;border-left:4px solid #FF6B00;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:#262626}
    .dealer-focus-reset-btn{padding:5px 11px;border-radius:7px;border:1px solid #E60012;background:#fff;color:#E60012;font-size:11.5px;font-weight:700;cursor:pointer;transition:all .15s ease}
    .dealer-focus-reset-btn:hover{background:#E60012;color:#fff}
    .dealer-ranking-viewall-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid #FFD8B8;background:#FFF7F0;color:#D75B00;white-space:nowrap;transition:all .16s ease}
    .dealer-ranking-viewall-btn:hover{background:#FF6B00;color:#fff;border-color:#FF6B00}
    .dealer-ranking-viewall-btn-low{border-color:#FFD8D8;background:#FFF3F3;color:#C8102E}
    .dealer-ranking-viewall-btn-low:hover{background:#E60012;color:#fff;border-color:#E60012}
    .ranking-modal-overlay{position:fixed;inset:0;background:rgba(20,20,26,.48);backdrop-filter:blur(2px);z-index:999990;display:none;align-items:center;justify-content:center;padding:18px}
    .ranking-modal-overlay.show{display:flex}
    .ranking-modal-dialog{background:#fff;width:min(680px,100%);max-height:82vh;border-radius:14px;border:1px solid #E2E5EA;box-shadow:0 16px 42px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
    .ranking-modal-header{padding:14px 18px;border-bottom:1px solid #EFF1F4;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff}
    .ranking-modal-header.high{border-left:5px solid #FF6B00}
    .ranking-modal-header.low{border-left:5px solid #E60012}
    .ranking-modal-title-wrap{min-width:0}
    .ranking-modal-title{font-size:14px;font-weight:800;color:#262626}
    .ranking-modal-subtitle{font-size:11.5px;color:#667085;margin-top:2px}
    .ranking-modal-close{width:32px;height:32px;border-radius:8px;border:1px solid #E5E7EB;background:#F9FAFB;color:#4B5563;font-size:16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 32px}
    .ranking-modal-close:hover{background:#FFF1F1;color:#C8102E;border-color:#FFD8D8}
    .ranking-modal-toolbar{padding:10px 18px;border-bottom:1px solid #F0F1F3;background:#FAFBFC}
    .ranking-modal-search{width:100%;height:36px;border:1px solid #D9DDE3;border-radius:8px;padding:0 12px;font-size:12.5px;outline:none;background:#fff;color:#262626}
    .ranking-modal-search:focus{border-color:#E60012;box-shadow:0 0 0 2px rgba(230,0,18,.08)}
    .ranking-modal-body{overflow-y:auto;overflow-x:hidden;flex:1 1 auto;max-height:calc(82vh - 130px);scrollbar-gutter:stable}
    .ranking-modal-body .dealer-ranking-row{grid-template-columns:46px minmax(0,1fr) auto;padding:9px 18px}

    /* ===== MATRIX ===== */
    .matrix-layout{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(250px,1fr);gap:16px;align-items:start}
    .quadrant-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}
    .quadrant-chip{height:38px;border-radius:8px;border:1px solid var(--csl-border);background:#fff;color:#404040;font-size:11.5px;font-weight:700;cursor:pointer}
    .quadrant-chip.active{color:#fff;border-color:transparent}
    .matrix-detail-panel{height:478px;border:1px solid #E7E9EC;border-radius:10px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
    .matrix-detail-head{flex:0 0 auto;padding:12px 14px 10px;border-bottom:1px solid #F0F1F3}
    .matrix-detail-roman{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}.matrix-detail-label{font-size:15px;font-weight:800;color:#262626}
    .matrix-detail-list{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 10px 10px;scrollbar-gutter:stable}
    .matrix-point-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;border:1px solid #F0F1F3;border-radius:6px;padding:6px 10px;margin-bottom:6px}
    .matrix-point-name{min-width:0;font-size:11.5px;color:#262626;line-height:1.25;overflow:hidden}.matrix-point-name b{font-size:12.5px}.matrix-point-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.matrix-point-value{font-size:11px;color:#666;text-align:right}
    .matrix-caption{font-size:11.5px;color:#666;margin-top:5px}
    .matrix-md-wrap{max-width:330px;margin:0 0 10px}

    /* ===== PROFILE ===== */
    .profile-top-grid{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:16px;
        align-items:start;
    }

    .profile-equal-card{
        height:420px;
        min-height:420px;
        max-height:420px;
        overflow:hidden;
    }

    .heatmap-scroll{
        height:340px;
        max-height:340px;
        overflow-y:auto;
        overflow-x:hidden;
        scrollbar-gutter:stable;
    }

    .profile-scroll{
        height:340px;
        overflow-y:auto;
        overflow-x:hidden;
        scrollbar-gutter:stable;
    }
    .profile-card{position:relative;background:#fff;border:1px solid var(--csl-border);border-radius:8px;height:64px;min-height:64px;max-height:64px;padding:0;margin-bottom:6px;box-shadow:none;transition:all .2s ease;overflow:hidden;cursor:pointer}
    .profile-card:hover{border-color:#E60012;background:#FFF6F6}.profile-card.active{background:#FFF1F1;border:1.5px solid #E60012}.profile-card.disabled,.profile-card.disabled:hover{background:#F7F7F7;border-color:#E2E2E2;cursor:default}.profile-card.disabled .profile-card-inner{opacity:.55}
    .profile-card-inner{display:flex;flex-direction:column;justify-content:center;gap:5px;width:100%;height:100%;min-height:62px;padding:8px 12px;box-sizing:border-box}
    .profile-card-header{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12.5px;line-height:1.2}.profile-card-title{font-weight:600;color:#212121}.profile-card.active .profile-card-title,.profile-card.active .profile-card-pct{color:#C8102E;font-weight:700}.profile-card-pct{font-weight:700;color:#212121;margin-left:8px;white-space:nowrap}.profile-bar-bg{background:#E0E0E0;border-radius:6px;height:6px;width:100%;overflow:hidden}.profile-bar-fill{border-radius:6px;height:100%}
    .profile-description-title{font-size:13px;font-weight:800;color:#262626;margin-bottom:12px}
    .insight-box{background:#FFF6F6;border:1px solid #FFDADA;border-left:4px solid #E60012;border-radius:8px;padding:16px 18px 18px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;box-shadow:none}
    .insight-box-header{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#C8102E;padding-bottom:8px;border-bottom:1px dashed #FFDADA}.insight-box-body{font-size:13.5px;color:#37474F;line-height:1.6;font-weight:400}
    .reco-box{background:#FFF8E8;border:1px solid #FCE7B8;border-left:4px solid #FF6B00;border-radius:8px;padding:16px 18px 18px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;box-shadow:none}.reco-box-header{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#B45300;padding-bottom:8px;border-bottom:1px dashed #FCE7B8}.reco-box-body{font-size:13.5px;color:#2E3B2C;line-height:1.6;font-weight:400}
    .profile-summary{width:100%;margin:14px 0 4px;padding:14px 16px;background:linear-gradient(135deg,#FFF7F2,#fff);border:1px solid #FFD7BF;border-left:4px solid #FF6B00;border-radius:10px;color:#3F3F46;font-size:13px;line-height:1.65}.profile-summary-title{font-size:11px;font-weight:800;letter-spacing:.5px;color:#C8102E;text-transform:uppercase;margin-bottom:5px}

    /* ===== DEMOGRAPHICS ===== */
    .demographic-grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.demographic-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.demographic-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.demographic-card{height:390px;min-height:390px;max-height:390px;overflow:hidden;display:flex;flex-direction:column}.chart-viewport{height:330px;min-height:330px;max-height:330px;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}.chart-viewport::-webkit-scrollbar{width:6px}.chart-viewport::-webkit-scrollbar-thumb{background:#D8DBDF;border-radius:20px}
    .fixed-chart-card{height:190px;min-height:190px;max-height:190px;overflow:hidden}.fixed-chart-card .legend-row{display:flex;flex-wrap:wrap;align-items:center;font-size:10px;line-height:1.45;color:#667085;padding:0 4px 4px}.legend-item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;margin:2px 12px 2px 0}.legend-dot{display:inline-block;width:10px;height:10px;border-radius:2px}
    .nps-card{height:390px;min-height:390px;max-height:390px;overflow:hidden}.nps-caption{font-size:11px;color:#666;margin:0 4px 6px}

    /* ===== REGION PAGE ===== */

<script>
/* ============================================================
 * KONFIGURASI DEPLOYMENT
 * Ganti SATU nilai ini dengan URL Web App Apps Script yang berakhiran /exec.
 * Contoh: https://script.google.com/macros/s/AKfycb.../exec
 * ============================================================ */
const GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbyBFkfmuAN3VgzUdULdSCYMMRNFCaAcN01Hx_i9yejIQe5GFikGpDT6yPqNY460xv8f/exec';

/* Sumber geometri yang sama dengan shapefile Python:
 * idn_admbnda_adm2_bps_20200401, layer ADM2 BPS 2020-04-01.
 */
const ADM2_ARCGIS_URL = 'https://services.arcgis.com/tKsJAIiLjd90D5q2/ArcGIS/rest/services/idn_adm_bps_20200401_shp/FeatureServer/4/query';

const COLORS = {
  RED:'#E60012', ORANGE:'#FF6B00', YELLOW:'#FFB000', GREEN:'#35A853', BLUE:'#1665D8', DARK_RED:'#C8102E'
};
const PAGE_OPTIONS_FALLBACK = ['H1 SALES','H2 SERVICE','H3 SPARE PART','PROFIL WILAYAH','FRAMEWORK'];
const UNIT_BY_PAGE = {'H1 SALES':'sales','H2 SERVICE':'service','H3 SPARE PART':'parts'};

const state = {
  config:null,
  activePage:'H1 SALES',
  lastUpdate:new Date(),
  unit:{
    sales:{year:'Semua',semester:'Semester 1',md:'Semua',layer:'Semua',kar:'Semua',kab:'Semua',dealer:'Semua',profile:'P1',matrixMd:'M2Z',selectedQuadrant:null,heatmap:null},

};

function escapeHtml(value){
  return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function setLoading(show){document.getElementById('loadingOverlay').classList.toggle('show',!!show)}
function infoBox(message, kind='info'){
  const cls = kind === 'error' ? 'error-box' : kind === 'warning' ? 'warning-box' : 'info-box';
  return `<div class="${cls}">${escapeHtml(message)}</div>`;
}
function formatWib(date=new Date()){
  const parts = new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(date);
  const map={}; parts.forEach(p=>map[p.type]=p.value);
  const monMap={'Jan':'Jan','Feb':'Feb','Mar':'Mar','Apr':'Apr','Mei':'Mei','Jun':'Jun','Jul':'Jul','Agu':'Agu','Sep':'Sep','Okt':'Okt','Nov':'Nov','Des':'Des','May':'Mei','Aug':'Agu','Oct':'Okt','Dec':'Des'};
  return `${map.day} ${monMap[map.month]||map.month} ${map.year}, ${map.hour}:${map.minute} WIB`;
}
function updateLastUpdate(){document.getElementById('lastUpdate').textContent = state.config?.lastUpdate || formatWib(state.lastUpdate)}
function isConfigured(){return GAS_EXEC_URL && GAS_EXEC_URL.startsWith('https://script.google.com/') && GAS_EXEC_URL.includes('/exec')}

/* JSONP digunakan karena Kode.gs sudah mendukung parameter callback.
 * Ini menghindari perubahan backend/CORS dan tetap satu index.html statis.
 */
function apiGet(action, params={}){
  return new Promise((resolve,reject)=>{
    if(!isConfigured()){
      reject(new Error('GAS_EXEC_URL belum diisi. Ganti nilai GAS_EXEC_URL pada index.html dengan URL deployment Apps Script /exec.'));
      return;
    }
    const callback = `__gas_cb_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const script = document.createElement('script');
    const query = new URLSearchParams({action, ...Object.fromEntries(Object.entries(params).filter(([,v])=>v!==undefined && v!==null)), callback, _ts:String(Date.now())});
    const timeout = setTimeout(()=>cleanup(new Error(`Timeout saat memanggil endpoint ${action}.`)), 90000);
    function cleanup(err,data){
      clearTimeout(timeout);
      try{delete window[callback]}catch(_){window[callback]=undefined}
      script.remove();
      if(err) reject(err); else resolve(data);
    }
    window[callback] = payload => {
      if(!payload || payload.ok === false) cleanup(new Error(payload?.error || `Endpoint ${action} gagal.`));
      else cleanup(null,payload);
    };
    script.onerror = ()=>cleanup(new Error(`Gagal memuat endpoint ${action}. Pastikan deployment Apps Script dapat diakses Anyone.`));
    script.src = `${GAS_EXEC_URL}?${query.toString()}`;
    document.head.appendChild(script);
  });
}

function unitParams(unit){
  const s=state.unit[unit];
  return {unit,year:s.year,semester:s.semester,md:s.md,layer:s.layer,kar:s.kar,kab:s.kab,dealer:s.dealer,profile:s.profile};
}
function syncUnitStateFromPayload(unit,payload){
  const s=state.unit[unit], fo=payload.filterOptions;
  if(!fo) return;
  s.year=fo.year?.selected ?? s.year;
  s.semester=fo.semester?.selected ?? s.semester;
  s.md=fo.mainDealer?.selected ?? s.md;
  s.layer=fo.layer?.selected ?? s.layer;
  s.kar=fo.karesidenan?.selected ?? s.kar;
  s.kab=fo.kabKota?.selected ?? s.kab;
  s.dealer=fo.dealer?.selected ?? s.dealer;
  if(payload.section3?.profileList?.selected) s.profile=payload.section3.profileList.selected;
}

function deepMerge(base, extra){
  const out = Array.isArray(base) ? base.slice() : {...base};
  if(!extra) return out;
  Object.entries(extra).forEach(([k,v])=>{
    if(v && typeof v==='object' && !Array.isArray(v) && base?.[k] && typeof base[k]==='object' && !Array.isArray(base[k])) out[k]=deepMerge(base[k],v);
    else out[k]=v;
  });
  return out;
}
function plotLayout(extra={}){
  const base={
    font:{family:'Inter, Segoe UI, Arial, sans-serif',color:'#262626',size:12},
    paper_bgcolor:'#FFFFFF',plot_bgcolor:'#FFFFFF',
    hoverlabel:{bgcolor:'#262626',font:{color:'#FFFFFF'},bordercolor:'#262626',align:'left'},
    xaxis:{gridcolor:'#F0F1F3',zerolinecolor:'#C7C9CD',linecolor:'#E7E9EC'},
    yaxis:{gridcolor:'#F0F1F3',zerolinecolor:'#C7C9CD',linecolor:'#E7E9EC'},
    legend:{bgcolor:'rgba(255,255,255,0)',font:{size:11}}
  };
  return deepMerge(base,extra);
}
const PLOT_CONFIG={responsive:true,displaylogo:false};
function purgePlot(el){try{if(el && el._fullLayout) Plotly.purge(el)}catch(_){}}
function makePlot(el,data,layout,config={}){if(!el)return; purgePlot(el); Plotly.newPlot(el,data,plotLayout(layout),{...PLOT_CONFIG,...config})}

function sectionTitle(badge,title){return `<div class="custom-section-title"><div class="custom-section-badge">${escapeHtml(badge)}</div><div class="custom-section-text">${escapeHtml(title)}</div></div>`}
function chartCard(title,subtitle='',id='',classes='chart-card'){
  return `<div class="${classes}"><div class="chart-title">${escapeHtml(title)}</div>${subtitle?`<div class="chart-subtitle">${escapeHtml(subtitle)}</div>`:''}<div class="plot" id="${id}"></div></div>`;
}
function renderKpis(cards){
  return `<div class="kpi-grid">${(cards||[]).map(c=>`<div class="kpi-card"><div class="kpi-label">${escapeHtml(c.label)}</div><div class="kpi-value">${escapeHtml(c.value)}</div><div class="kpi-sub" style="color:${escapeHtml(c.subColor)}">${escapeHtml(c.sub)}</div></div>`).join('')}</div>`;
}

function buildSelect(fieldId,payload,paramKey,unit){
  if(!payload) return '';
  let options=[];
  if(Array.isArray(payload.options) && payload.options.length && typeof payload.options[0]==='object') options=payload.options.map(o=>({value:String(o.value),label:String(o.label)}));
  else options=(payload.options||[]).map(v=>({value:String(v),label:String(v)}));
  const htmlOptions=options.map(o=>`<option value="${escapeHtml(o.value)}" ${String(payload.selected)===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('');
  return `<div class="filter-field"><label for="${fieldId}">${escapeHtml(payload.label)}</label><select id="${fieldId}" data-unit="${unit}" data-param="${paramKey}">${htmlOptions}</select></div>`;
}
function renderFilters(unit,fo){
  return `<div class="filters-grid" id="filters-${unit}">
    ${buildSelect(`${unit}-year`,fo.year,'year',unit)}
    ${buildSelect(`${unit}-semester`,fo.semester,'semester',unit)}
    ${buildSelect(`${unit}-md`,fo.mainDealer,'md',unit)}
    ${buildSelect(`${unit}-layer`,fo.layer,'layer',unit)}
    ${buildSelect(`${unit}-kar`,fo.karesidenan,'kar',unit)}
    ${buildSelect(`${unit}-kab`,fo.kabKota,'kab',unit)}
    ${buildSelect(`${unit}-dealer`,fo.dealer,'dealer',unit)}
  </div>`;
}
function bindFilterEvents(unit){
  document.querySelectorAll(`#filters-${unit} select[data-param]`).forEach(sel=>{
    sel.addEventListener('change',async e=>{
      state.unit[unit][e.target.dataset.param]=e.target.value;
      await renderUnitPage(unit,{preserveScroll:true,skipHeatmap:true});
    });
  });
}

function renderPageSelector(){
  const opts=state.config?.pageOptions || PAGE_OPTIONS_FALLBACK;
  document.getElementById('pageSelector').innerHTML=opts.map(p=>`<button class="page-btn ${state.activePage===p?'active':''}" data-page="${escapeHtml(p)}">${escapeHtml(p)}</button>`).join('');
  document.querySelectorAll('.page-btn').forEach(btn=>btn.addEventListener('click',async()=>{
    if(state.activePage===btn.dataset.page) return;
    state.activePage=btn.dataset.page;
    renderPageSelector();
    await renderActivePage();
  }));
}

function resetActivePageState(){
  const unit=UNIT_BY_PAGE[state.activePage];
  if(unit){
    state.unit[unit]={year:'Semua',semester:'Semester 1',md:'Semua',layer:'Semua',kar:'Semua',kab:'Semua',dealer:'Semua',profile:'P1',matrixMd:'M2Z',selectedQuadrant:null,heatmap:state.unit[unit]?.heatmap||null};
  }else if(state.activePage==='PROFIL WILAYAH'){
    state.region={h:'H1',cluster:'Semua',sort:'Profile Wilayah'};
  }
}

<script>
/* ============================================================
 * GEOMETRY + MAP
 * ============================================================ */
function normalizeLocationName(value){
  if(value===null || value===undefined || String(value).trim()==='') return '';
  let name=String(value).trim().toLowerCase();
  name=name.replace(/\bkab-kodya\b/g,'');
  name=name.replace(/\b(kabupaten|kab|kodya|kota)\b\.?/g,'');
  name=name.replace(/\s+/g,' ').trim();
  return name;
}
function dashboardRegionName(value){
  if(value===null || value===undefined || String(value).trim()==='') return '';
  let raw=String(value).trim().toLowerCase().replace(/[_/]+/g,' ').replace(/\s+/g,' ').trim();
  const simple=normalizeLocationName(raw);
  if(simple==='ntt' || simple==='nusa tenggara timur' || simple.includes('kupang')) return 'Kupang';
  if(raw.includes('kota malang') || raw.includes('kodya malang')) return 'Kota Malang';
  if(simple==='malang' || simple==='batu') return 'Malang';
  const merged={mojokerto:'Mojokerto',kediri:'Kediri',probolinggo:'Probolinggo',pasuruan:'Pasuruan',madiun:'Madiun',blitar:'Kab-Kodya Blitar'};
  if(merged[simple]) return merged[simple];
  return simple.replace(/\b\w/g,c=>c.toUpperCase());
}
function combineFeatures(features){
  if(!features.length) return null;
  let out=features[0];
  for(let i=1;i<features.length;i++){
    try{ out=turf.union(out,features[i]) || out; }catch(_){ /* geometry source is valid; keep first if browser union fails */ }
  }
  try{return turf.simplify(out,{tolerance:.005,highQuality:true,mutate:false})}catch(_){return out}
}
async function loadAdminGeometry(){
  if(state.geometry) return state.geometry;
  if(state.geometryPromise) return state.geometryPromise;
  state.geometryPromise=(async()=>{
    const query=new URLSearchParams({
      where:"ADM1_EN IN ('Jawa Timur','Nusa Tenggara Timur')",
      outFields:'ADM2_EN,ADM1_EN',returnGeometry:'true',outSR:'4326',f:'geojson'
    });
    const response=await fetch(`${ADM2_ARCGIS_URL}?${query.toString()}`);
    if(!response.ok) throw new Error('Gagal mengambil geometri batas kabupaten/kota.');
    const gj=await response.json();
    const groups={};
    (gj.features||[]).forEach(f=>{
      const prov=String(f.properties?.ADM1_EN||'').trim().toLowerCase();
      const region=prov.includes('nusa tenggara timur') ? 'NTT' : dashboardRegionName(f.properties?.ADM2_EN||'');
      if(!region) return;
      (groups[region] ||= []).push(f);
    });
    const byRegion={};
    Object.entries(groups).forEach(([region,features])=>{
      const feature=combineFeatures(features);
      if(feature){ feature.properties={...(feature.properties||{}),region}; byRegion[region]=feature; }
    });

function mapTooltipHtml(stat,mapData,displayRegion){
  const aliases=mapData.tooltipAliases||['Kabupaten/Kota:','Satisfaction:','%CSL H123:','Profile Dominan:'];
  return `<div style="font:12px Inter,Arial;line-height:1.55;text-align:left"><b>${escapeHtml(aliases[0]||'Kabupaten/Kota:')}</b> ${escapeHtml(displayRegion)}<br>`+
    `<b>${escapeHtml(aliases[1]||'Satisfaction:')}</b> ${escapeHtml(stat?.satisfactionText||'Tidak ada data')}<br>`+

    `<b>${escapeHtml(aliases[3]||'Profile Dominan:')}</b> ${escapeHtml(stat?.dominantProfile||'-')}</div>`;

function featureToInsetSvg(feature,color,label){
  if(!feature) return '';
  const bbox=turf.bbox(feature), [minX,minY,maxX,maxY]=bbox;
  const W=320,H=176,pad=16, dx=Math.max(maxX-minX,1e-8), dy=Math.max(maxY-minY,1e-8);
  const scale=Math.min((W-pad*2)/dx,(H-pad*2)/dy);
  const project=([x,y])=>[pad+(x-minX)*scale,H-pad-(y-minY)*scale];
  const paths=[];
  const geom=feature.geometry||{};
  const polys=geom.type==='Polygon'?[geom.coordinates]:(geom.type==='MultiPolygon'?geom.coordinates:[]);
  polys.forEach(poly=>poly.forEach(ring=>{
    const d=ring.map((c,i)=>{const [x,y]=project(c);return `${i?'L':'M'}${x.toFixed(2)},${y.toFixed(2)}`}).join(' ')+' Z';
    paths.push(`<path d="${d}" fill="${escapeHtml(color)}" fill-opacity=".92" stroke="#FFFFFF" stroke-width="1.5"/>`);
  }));
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-label="${escapeHtml(label)}">${paths.join('')}</svg>`;
}

function stackedInsideText(seg){
  const value=Number(seg.value)||0, clean=String(seg.label||'').replace(/\s+/g,' ').trim(), pct=seg.pctText||`${value.toFixed(1)}%`;
  const chars=Math.max(4,Math.floor(value*1.10));
  if(value<5) return pct;
  if(clean.length<=chars) return `${pct}<br>${clean}`;
  const words=clean.split(/\s+/), lines=[''];
  for(const w of words){
    const i=lines.length-1, candidate=(lines[i]+' '+w).trim();
    if(candidate.length<=chars) lines[i]=candidate;
    else lines.push(w);
  }
  if(lines.length<=2) return `${pct}<br>${lines.join('<br>')}`;
  const maxChars=Math.max(6,chars*2);
  let short=clean.length>maxChars?clean.slice(0,maxChars-1).trimEnd()+'…':clean;
  const shortWords=short.split(/\s+/), shortLines=[''];
  for(const w of shortWords){
    const i=shortLines.length-1,c=(shortLines[i]+' '+w).trim();
    if(c.length<=chars)shortLines[i]=c;else shortLines.push(w);
  }
  return `${pct}<br>${shortLines.slice(0,2).join('<br>')}`;
}

  if(!p?.available){el.innerHTML=infoBox(p?.message||'Data tidak tersedia.');return}
  makePlot(el,[{type:'indicator',mode:'gauge+number',value:p.value,number:{suffix:'',font:{size:30,color:'#212121'}},gauge:{axis:{range:[0,100],tickwidth:1,tickcolor:'#666'},bar:{color:p.barColor||'#212121',thickness:.25},steps:(p.steps||[]).map(s=>({range:s.range,color:s.color})),threshold:{line:{color:'#000000',width:4},thickness:.8,value:p.value}}}],{height:p.height||250,margin:{l:15,r:15,t:10,b:10}});
  const cap=document.getElementById(captionId);if(cap)cap.textContent=p.caption||'';
}

function matrixDetailHtml(matrix,qk){
  const q=matrix.quadrants[qk], items=matrix.pointsByQuadrant[qk]||[];
  return `<div class="matrix-detail-head"><div class="matrix-detail-roman" style="color:${escapeHtml(q.color)}">${escapeHtml(q.roman)}</div><div class="matrix-detail-label">${escapeHtml(q.label)}</div></div><div class="matrix-detail-list">`+
    (items.length?items.map(p=>`<div class="matrix-point-item"><div class="matrix-point-name"><b>${escapeHtml(p.code)}</b><div class="matrix-point-desc" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div></div><div class="matrix-point-value">Sat. ${Number(p.x).toFixed(1)}%<br>Imp. ${Number(p.y).toFixed(2)}</div></div>`).join(''):infoBox('Tidak ada indikator pada kuadran ini.'))+'</div>';
}
function renderMatrixSection(unit,matrix){
  const box=document.getElementById(`matrix-body-${unit}`);if(!box)return;
  if(!matrix?.available){box.innerHTML=infoBox(matrix?.message||'Data matriks tidak tersedia.');return}
  let selected=state.unit[unit].selectedQuadrant;
  if(!selected || !matrix.quadrants[selected]) selected=matrix.defaultQuadrant;
  state.unit[unit].selectedQuadrant=selected;
  const mdHtml=matrix.mdSelectorNeeded?`<div class="matrix-md-wrap"><div class="filter-field"><label>Pilih Main Dealer (Matriks)</label><select id="matrix-md-${unit}"><option value="M2Z" ${state.unit[unit].matrixMd==='M2Z'?'selected':''}>M2Z</option><option value="M3Z" ${state.unit[unit].matrixMd==='M3Z'?'selected':''}>M3Z</option><option value="SEMUA" ${state.unit[unit].matrixMd==='SEMUA'?'selected':''}>Semua</option></select></div></div>`:'';
  box.innerHTML=`<div class="section-description">${escapeHtml(matrix.description||'')}</div>${mdHtml}<div class="matrix-layout"><div><div class="quadrant-chips">${matrix.quadrantOrder.map(qk=>{const q=matrix.quadrants[qk];return `<button class="quadrant-chip ${qk===selected?'active':''}" data-q="${qk}" style="${qk===selected?`background:${q.color}`:''}">${escapeHtml(q.roman)} · ${escapeHtml(q.label)}</button>`}).join('')}</div><div id="matrix-plot-${unit}" class="plot"></div><div class="matrix-caption">${escapeHtml(matrix.caption||'')}</div></div><div class="matrix-detail-panel" id="matrix-detail-${unit}">${matrixDetailHtml(matrix,selected)}</div></div>`;
  if(matrix.mdSelectorNeeded){document.getElementById(`matrix-md-${unit}`).addEventListener('change',async e=>{state.unit[unit].matrixMd=e.target.value;setLoading(true);try{const r=await apiGet('matrix',{...unitParams(unit),matrixMd:e.target.value});state.unit[unit].matrix=r.matrix;renderMatrixSection(unit,r.matrix)}finally{setLoading(false)}})}
  box.querySelectorAll('.quadrant-chip').forEach(btn=>btn.addEventListener('click',()=>{state.unit[unit].selectedQuadrant=btn.dataset.q;renderMatrixSection(unit,matrix)}));
  const qsel=state.unit[unit].selectedQuadrant;
  const activePoints = matrix.points.filter(p => p.quadrant === qsel);
  const inactivePoints = matrix.points.filter(p => p.quadrant !== qsel);

  const el = document.getElementById(`matrix-plot-${unit}`);

  const makeCustomData = p => [
    p.code,
    p.name,
    p.avgSat,
    p.rawSat,
    p.rankSat,
    p.rankImp,
    p.quadrant
  ];

  const hoverTemplate =
    '<b>Kode Indikator:</b> %{customdata[0]}<br>' +
    '<b>Nama Indikator:</b> %{customdata[1]}<br>' +
    '<b>AVG Satisfaction:</b> %{customdata[2]:.2f}%<br>' +
    '<b>Satisfaction:</b> %{customdata[3]:.2f}<br>' +
    '<b>Importance:</b> %{y:.2f}<br>' +
    '<b>Rank Satisfaction:</b> %{customdata[4]}<br>' +
    '<b>Rank Importance:</b> %{customdata[5]}<extra></extra>';

  makePlot(el, [

    /* ==========================================
      TITIK KUADRAN YANG TIDAK AKTIF
      ========================================== */
    {
      type: 'scatter',
      mode: 'markers',
      x: inactivePoints.map(p => p.x),
      y: inactivePoints.map(p => p.y),

      marker: {
        color: inactivePoints.map(p => p.color),
        size: 8,
        opacity: 0.55,
        line: {
          color: '#FFFFFF',
          width: 1
        }
      },

      customdata: inactivePoints.map(makeCustomData),
      hovertemplate: hoverTemplate,

      showlegend: false
    },

    /* ==========================================
      TITIK KUADRAN YANG AKTIF
      ========================================== */
    {
      type: 'scatter',
      mode: 'markers+text',
      x: activePoints.map(p => p.x),
      y: activePoints.map(p => p.y),

      text: activePoints.map(p => p.code),
      textposition: 'top center',

      textfont: {
        size: 10,
        color: '#454545'
      },

      marker: {
        color: activePoints.map(p => p.color),
        size: 14,
        opacity: 1,
        line: {
          color: '#FFFFFF',
          width: 2
        }
      },

      customdata: activePoints.map(makeCustomData),
      hovertemplate: hoverTemplate,

      showlegend: false
    }

  ], {
    xaxis:{title:'Satisfaction (%)',range:[matrix.xLo,matrix.xHi]},yaxis:{title:'Importance',range:[matrix.yLo,matrix.yHi]},height:480,margin:{l:55,r:15,t:16,b:50},showlegend:false,
    shapes:[
      ...matrix.quadrantOrder.map(qk=>{const q=matrix.quadrants[qk], active=qk===qsel; let x0,x1,y0,y1;if(qk==='keep'){x0=matrix.xMid;x1=matrix.xHi;y0=matrix.yMid;y1=matrix.yHi}else if(qk==='priority'){x0=matrix.xLo;x1=matrix.xMid;y0=matrix.yMid;y1=matrix.yHi}else if(qk==='gradual'){x0=matrix.xLo;x1=matrix.xMid;y0=matrix.yLo;y1=matrix.yMid}else{x0=matrix.xMid;x1=matrix.xHi;y0=matrix.yLo;y1=matrix.yMid}return {type:'rect',xref:'x',yref:'y',x0,x1,y0,y1,fillcolor:q.color,opacity:active?.26:.025,line:{width:0},layer:'below'}}),
      {type:'line',x0:matrix.xMid,x1:matrix.xMid,y0:matrix.yLo,y1:matrix.yHi,line:{color:'#777',dash:'dash',width:1.2}},
      {type:'line',x0:matrix.xLo,x1:matrix.xHi,y0:matrix.yMid,y1:matrix.yMid,line:{color:'#777',dash:'dash',width:1.2}}
    ]
  });
  el.on('plotly_click',ev=>{const idx=ev?.points?.[0]?.pointIndex;if(idx!==undefined&&matrix.points[idx]){state.unit[unit].selectedQuadrant=matrix.points[idx].quadrant;renderMatrixSection(unit,matrix)}});
}

function drawDemographicObject(unit,row,key,obj){
  const id=`${unit}-demo-${row}-${key}`;
  if(!obj?.available){const el=document.getElementById(id);if(el)el.innerHTML=infoBox(obj?.message||'Data tidak tersedia.');return}
  if(obj.steps) return renderNpsGauge(id,obj,`${id}-caption`);
  if(obj.segments) return renderStackedPlot(id,obj,`${id}-legend`);
  if(obj.maxCount!==undefined) return renderReasonsPlot(id,obj);
  if(obj.labels && obj.values) return renderPiePlot(id,obj);
  if(obj.items) return renderPercentHbar(id,obj);
}
function drawDemographics(unit,dem){
  Object.entries(dem?.rows||{}).forEach(([row,content])=>Object.entries(content||{}).forEach(([key,obj])=>{if(key!=='columns')drawDemographicObject(unit,row,key,obj)}));
}
function bindProfileCards(unit){
  document.querySelectorAll(`[data-profile]`).forEach(card=>card.addEventListener('click',async()=>{
    if(card.classList.contains('disabled'))return;
    const code=card.dataset.profile;if(state.unit[unit].profile===code)return;
    state.unit[unit].profile=code;
    await renderUnitPage(unit,{preserveScroll:true,skipHeatmap:true});
  }));
}
function resolveDealerCodeFromItem(x, unit){
  if(x?.code) return String(x.code).trim();
  const label=String(x?.label||'').trim();
  const opts=state.unit[unit]?.page?.filterOptions?.dealer?.options||[];
  for(const o of opts){
    if(typeof o==='object' && String(o.label).trim()===label) return String(o.value).trim();
  }
  const m=label.match(/\(([^()]+)\)\s*$/);
  return m ? m[1].trim() : label;
}
function rankingRowHtml(x, low, unit){
  const code=resolveDealerCodeFromItem(x, unit);
  const currentDealer=state.unit[unit]?.dealer||'Semua';
  const isActive=(currentDealer!=='Semua' && String(currentDealer)===String(code));
  const hintText=isActive?'Sedang Dianalisis':'Klik untuk Fokus →';
  return `<div class="dealer-ranking-row clickable ${low?'low-row':''} ${isActive?'active-dealer':''}" data-select-dealer="${escapeHtml(code)}" data-select-label="${escapeHtml(x.label)}" title="Klik untuk fokus analisis ${escapeHtml(x.label)}">`+
    `<div class="dealer-rank ${low?'dealer-rank-low':''}">#${escapeHtml(x.rank)}</div>`+
    `<div class="dealer-ranking-name"><span>${escapeHtml(x.label)}</span></div>`+
    `<div class="dealer-ranking-value ${low?'dealer-ranking-value-low':''}"><span class="dealer-click-hint">${escapeHtml(hintText)}</span><span>${escapeHtml(x.value)}</span></div>`+
  `</div>`;
}
function rankingHtml(r, unit){
  if(!r?.show)return '';
  if(r.empty)return `<div style="margin-top:14px">${infoBox(r.message||'Nilai satisfaction dealer tidak tersedia.')}</div>`;
  const totalCount=(r.allHigh?.length||r.totalCount||r.top?.length||0);
  const countBadge=totalCount?` (${totalCount})`:'';
  const s=state.unit[unit]||{};
  const entity=r.entityLabel||'Dealer';
  const currentDealer=s.dealer||'Semua';
  let activeDealerLabel=currentDealer;
  if(currentDealer!=='Semua'){
    const opts=s.page?.filterOptions?.dealer?.options||[];
    const found=opts.find(o=>typeof o==='object' && String(o.value)===String(currentDealer));
    if(found) activeDealerLabel=found.label;
  }
  const focusBanner=(currentDealer!=='Semua')
    ? `<div class="dealer-focus-banner">`+
        `<div><i class="fa-solid fa-magnifying-glass-chart" style="color:#E60012;margin-right:6px"></i><b>Fokus Analisis ${escapeHtml(entity)}:</b> ${escapeHtml(activeDealerLabel)} <span style="color:#667085;font-size:11.5px">(Klik ${escapeHtml(entity.toLowerCase())} lain di bawah atau di popup untuk membandingkan)</span></div>`+
        `<button type="button" class="dealer-focus-reset-btn" id="resetDealerFocusBtn"><i class="fa-solid fa-rotate-left"></i> Tampilkan Semua ${escapeHtml(entity)}</button>`+
      `</div>`
    : '';
  const build=(items,low)=>items.map(x=>rankingRowHtml(x,low,unit)).join('');
  return `${focusBanner}<div class="ranking-grid" style="margin-top:14px">`+
    `<div class="dealer-ranking-card"><div class="dealer-ranking-title dealer-ranking-title-high"><span>${escapeHtml(r.highTitle)}</span><button type="button" class="dealer-ranking-viewall-btn" data-ranking-modal="high" title="Lihat urutan seluruh ${escapeHtml(entity)} dari tertinggi"><i class="fa-solid fa-list-ol"></i> Lihat Semua${escapeHtml(countBadge)}</button></div>${build(r.top||[],false)}</div>`+
    `<div class="dealer-ranking-card"><div class="dealer-ranking-title dealer-ranking-title-low"><span>${escapeHtml(r.lowTitle)}</span><button type="button" class="dealer-ranking-viewall-btn dealer-ranking-viewall-btn-low" data-ranking-modal="low" title="Lihat urutan seluruh ${escapeHtml(entity)} dari terendah"><i class="fa-solid fa-list-ol"></i> Lihat Semua${escapeHtml(countBadge)}</button></div>${build(r.bottom||[],true)}</div>`+
    `</div>`+
    `<div class="ranking-modal-overlay" id="rankingModalOverlay" role="dialog" aria-modal="true">`+
      `<div class="ranking-modal-dialog">`+
        `<div class="ranking-modal-header" id="rankingModalHeader">`+
          `<div class="ranking-modal-title-wrap"><div class="ranking-modal-title" id="rankingModalTitle"></div><div class="ranking-modal-subtitle" id="rankingModalSubtitle"></div></div>`+
          `<button type="button" class="ranking-modal-close" id="rankingModalClose" aria-label="Tutup">&times;</button>`+
        `</div>`+
        `<div class="ranking-modal-toolbar"><input type="search" class="ranking-modal-search" id="rankingModalSearch" placeholder="Cari nama atau kode..." autocomplete="off"/></div>`+
        `<div class="ranking-modal-body" id="rankingModalBody"></div>`+
      `</div>`+
    `</div>`;
}
function bindRankingModal(unit, r){
  if(!r?.show || r.empty)return;
  const overlay=document.getElementById('rankingModalOverlay');
  if(!overlay)return;
  const header=document.getElementById('rankingModalHeader');
  const titleEl=document.getElementById('rankingModalTitle');
  const subEl=document.getElementById('rankingModalSubtitle');
  const searchEl=document.getElementById('rankingModalSearch');
  const bodyEl=document.getElementById('rankingModalBody');
  const closeBtn=document.getElementById('rankingModalClose');
  let activeItems=[], isLow=false;

  async function selectDealer(code){
    if(!code)return;
    overlay.classList.remove('show');
    const s=state.unit[unit];
    s.dealer = (String(s.dealer)===String(code)) ? 'Semua' : code;
    await renderUnitPage(unit,{preserveScroll:true,skipHeatmap:true});
  }

  function bindDealerRowClicks(container){
    container.querySelectorAll('[data-select-dealer]').forEach(row=>{
      row.addEventListener('click',()=>selectDealer(row.dataset.selectDealer));
    });
  }

  bindDealerRowClicks(document);

  const resetFocusBtn=document.getElementById('resetDealerFocusBtn');
  if(resetFocusBtn){
    resetFocusBtn.addEventListener('click',async()=>{
      state.unit[unit].dealer='Semua';
      await renderUnitPage(unit,{preserveScroll:true,skipHeatmap:true});
    });
  }

  function renderRows(query=''){
    const q=String(query||'').trim().toLowerCase();
    const filtered=q?activeItems.filter(x=>String(x.label||'').toLowerCase().includes(q)):activeItems;
    if(!filtered.length){
      bodyEl.innerHTML=`<div style="padding:16px">${infoBox('Tidak ada data yang cocok dengan pencarian.')}</div>`;
      return;
    }
    bodyEl.innerHTML=filtered.map(x=>rankingRowHtml(x,isLow,unit)).join('');
    bindDealerRowClicks(bodyEl);
  }
  function openModal(mode){
    isLow=(mode==='low');
    const entity=r.entityLabel||'Dealer';
    activeItems=isLow?(r.allLow||r.bottom||[]):(r.allHigh||r.top||[]);
    header.className=`ranking-modal-header ${isLow?'low':'high'}`;
    titleEl.textContent=isLow
      ?(r.allLowTitle||`Urutan Seluruh ${entity} (Satisfaction Terendah)`)
      :(r.allHighTitle||`Urutan Seluruh ${entity} (Satisfaction Tertinggi)`);
    subEl.textContent=`Total ${activeItems.length} ${entity} · Klik salah satu ${entity.toLowerCase()} untuk fokus menganalisis detailnya`;
    searchEl.value='';
    searchEl.placeholder=`Cari nama atau kode ${entity}...`;
    renderRows('');
    overlay.classList.add('show');
    bodyEl.scrollTop=0;
    setTimeout(()=>searchEl.focus(),40);
  }
  function closeModal(){overlay.classList.remove('show')}
  document.querySelectorAll('[data-ranking-modal]').forEach(btn=>{
    btn.addEventListener('click',()=>openModal(btn.dataset.rankingModal));
  });
  searchEl.addEventListener('input',e=>renderRows(e.target.value));
  closeBtn.addEventListener('click',closeModal);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
  document.addEventListener('keydown',function escHandler(e){
    if(!document.body.contains(overlay)){document.removeEventListener('keydown',escHandler);return;}
    if(e.key==='Escape' && overlay.classList.contains('show'))closeModal();
  });
}

/* ============================================================
 * UNIT PAGE — H1 / H2 / H3
 * ============================================================ */
async function renderUnitPage(unit,{preserveScroll=false,skipHeatmap=false}={}){
  const scrollY=preserveScroll?window.scrollY:0; setLoading(true);
  try{
    const s=state.unit[unit];
    const calls=[apiGet('unitPage',unitParams(unit)),apiGet('matrix',{...unitParams(unit),matrixMd:s.matrixMd})];
    if(!skipHeatmap || !s.heatmap) calls.push(apiGet('heatmap',{unit}));
    const results=await Promise.all(calls), page=results[0], matrix=results[1].matrix;
    const heatmap=(results[2]?.heatmap)||s.heatmap;
    s.heatmap=heatmap;s.matrix=matrix;s.page=page;syncUnitStateFromPayload(unit,page);
    const sec1=page.section1||{}, sec3=page.section3||{};
    const scopeKey=[s.year,s.semester,s.md,s.layer,s.kar,s.kab].join('||');
    if(sec1.ranking?.show && !sec1.ranking.empty){
      s.lastRanking=sec1.ranking;
      s.lastRankingScopeKey=scopeKey;
    }
    const activeRanking=(sec1.ranking?.show)?sec1.ranking:((s.lastRanking && s.lastRankingScopeKey===scopeKey)?s.lastRanking:sec1.ranking);
    const charts=[sec1.satisfactionChart,sec1.targetGapChart,...(sec1.semesterDifferenceChart?[sec1.semesterDifferenceChart]:[])];
    const chartGridClass=sec1.chartLayout===3?'charts-grid-3':'charts-grid-2';
    const chartIds=[`${unit}-sat`,`${unit}-gap`,`${unit}-diff`];
    const chartHtml=charts.map((c,i)=>chartCard(c?.title||'',c?.subtitle||'',chartIds[i])).join('');
    document.getElementById('app').innerHTML=`
      <section class="section section-1">${sectionTitle('SECTION 1','CSL PERFORMANCE INDEX')}
        <div class="map-header"><div class="map-header-title">Satisfaction Map</div><div class="map-header-badge">CLICK MAP TO FILTER</div></div>
        <div class="map-wrap"><div id="satisfaction-map"></div></div>
        <div style="height:16px"></div>${renderFilters(unit,page.filterOptions)}<div style="height:16px"></div>${renderKpis(sec1.kpi||[])}
        <div style="height:14px"></div><div class="${chartGridClass}">${chartHtml}</div>${rankingHtml(activeRanking,unit)}
      </section>
      <section class="section section-2">${sectionTitle('SECTION 2','MATRIX SATISFACTION x IMPORTANCE')}<div id="matrix-body-${unit}"></div></section>
      <section class="section section-3">${sectionTitle('SECTION 3','PROFILE CUSTOMER')}
        <div class="profile-top-grid">
          <div class="profile-equal-card"><div class="chart-title">${escapeHtml(heatmap?.title||'Customer Profile Heatmap vs Overall Average')}</div><div class="chart-subtitle">${escapeHtml(heatmap?.subtitle||'')}</div><div class="heatmap-scroll"><div class="plot" id="${unit}-heatmap"></div></div></div>
          <div class="profile-equal-card" id="${unit}-profile-list">${profileListHtml(unit,sec3.profileList||{items:[]})}</div>
          <div class="profile-equal-card" id="${unit}-profile-description">${profileExplanationHtml(sec3.profileExplanation||{})}</div>
        </div>
        ${sec3.insight?.available?`<div class="profile-summary"><div class="profile-summary-title">${escapeHtml(sec3.insight.header)}</div>${sec3.insight.narrative}</div>`:infoBox(sec3.insight?.message||'Ringkasan profil belum tersedia.')}
        ${demographicsHtml(unit,sec3.demographics)}
      </section>`;
    bindFilterEvents(unit); bindProfileCards(unit); bindRankingModal(unit,activeRanking); renderMatrixSection(unit,matrix);
    renderSatisfactionPlot(`${unit}-sat`,sec1.satisfactionChart);renderGapPlot(`${unit}-gap`,sec1.targetGapChart);if(sec1.semesterDifferenceChart)renderDiffPlot(`${unit}-diff`,sec1.semesterDifferenceChart);
    renderHeatmapPlot(`${unit}-heatmap`,heatmap);drawDemographics(unit,sec3.demographics);await renderSatisfactionMap(sec1.map,unit);
    if(preserveScroll)window.scrollTo({top:scrollY,behavior:'auto'});else window.scrollTo({top:0,behavior:'auto'});
  }catch(err){document.getElementById('app').innerHTML=infoBox(err.message,'error')}
  finally{setLoading(false)}
}

function markdownBold(s){return escapeHtml(s||'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function regionDetailsHtml(details,culture=false){
  if(!details?.items?.length)return '';
  return `<div class="region-card" style="margin-top:12px"><div class="chart-title">${escapeHtml(details.title)}</div>${details.caption?`<div class="chart-subtitle">${escapeHtml(details.caption)}</div>`:''}${details.items.map(x=>`<div class="region-detail-box ${culture?'culture':''}"><div class="region-detail-title">${escapeHtml(x.title)} <span class="region-detail-count">${escapeHtml(x.countText||'')}</span></div><div class="region-detail-body">${escapeHtml(x.description||'')}${x.character?`<br><b>Karakter:</b> ${escapeHtml(x.character)}`:''}<br><b>Wilayah:</b> ${escapeHtml(x.regions||'-')}</div></div>`).join('')}</div>`;
}
function insightItemsHtml(box){
  if(!box?.items?.length)return infoBox(box?.emptyMessage||'Belum ada insight.');
  return box.items.map(x=>`<div class="region-detail-box"><div class="region-detail-title">${escapeHtml(x.header)}</div><div class="region-detail-body"><b>Profile Mayoritas:</b> ${escapeHtml(x.majorityProfile)}<br><b>Wilayah Sesuai/Valid:</b> ${escapeHtml(x.regionsMatched)} / ${escapeHtml(x.regionsValid)}<br><b>Konsistensi:</b> ${escapeHtml(x.consistency)}<br><b>Kemiripan Distribusi:</b> ${escapeHtml(x.similarity)} · ${escapeHtml(x.category)}</div></div>`).join('');
}
function renderRegionStacked(id,p){
  const el=document.getElementById(id);if(!el)return;
  const traces=(p.series||[]).map(s=>({type:'bar',orientation:'h',name:s.name,x:s.values,y:p.regions,marker:{color:s.color},customdata:s.counts.map((c,i)=>[c,p.totals[i],s.profileLabel]),text:s.values.map(v=>v>=6?`${v.toFixed(1)}%`:''),textposition:'inside',insidetextanchor:'middle',hovertemplate:'<b>%{y}</b><br>%{customdata[2]}: %{x:.1f}%<br>Responden profile: %{customdata[0]}<br>Total responden: %{customdata[1]}<extra></extra>'}));
  makePlot(el,traces,{barmode:'stack',height:p.height,margin:{l:90,r:20,t:10,b:45},xaxis:{title:'Persentase Responden',range:[0,100],ticksuffix:'%'},yaxis:{autorange:'reversed',automargin:true},legend:{orientation:'h',y:-.12,x:.5,xanchor:'center'},uniformtext:{mode:'hide',minsize:8}});
}
function renderDominantPlot(id,p){
  const el=document.getElementById(id);if(!el)return;
  const traces=(p.series||[]).map(s=>({type:'bar',name:s.name,x:p.xLabels,y:s.values,marker:{color:s.color},width:p.barWidth,text:s.values.map(v=>v>=7?`${v.toFixed(1)}%`:''),textposition:'inside',hovertemplate:`<b>%{x}</b><br>${escapeHtml(s.name)}: %{y:.1f}%<extra></extra>`}));
  makePlot(el,traces,{barmode:'stack',height:p.height||300,margin:{l:55,r:15,t:10,b:70},xaxis:{title:p.xAxisTitle,tickangle:-18,automargin:true},yaxis:{title:p.yAxisTitle,range:[0,100],ticksuffix:'%'},legend:{title:{text:p.legendTitle||''},orientation:'h',y:-.28,x:.5,xanchor:'center'}});
}
async function renderRegionPage(){
  setLoading(true);
  try{
    const r=await apiGet('regionPage',{h:state.region.h,cluster:state.region.cluster,sort:state.region.sort}),p=r.regionPage;
    if(!p?.available){document.getElementById('app').innerHTML=infoBox(p?.error||'Data Profil Wilayah tidak tersedia.','warning')+(p?.hint?infoBox(p.hint):'');return}
    state.region.h=p.selection.h;state.region.cluster=p.selection.cluster;state.region.sort=p.selection.sortProfile;
    const meth=p.clusteringMethodology||{};
    document.getElementById('app').innerHTML=`<section class="section section-4">${sectionTitle(p.sectionBadge||'SECTION 4',p.sectionTitle||'PROFIL WILAYAH & CLUSTER BUDAYA')}<div class="section-description">${escapeHtml(p.description||'')}</div>
      <div class="region-filters">${selectFromOptions('region-h','Pilih H',p.options.h,state.region.h)}${selectFromOptions('region-cluster','Profil / Cluster Wilayah',p.options.cluster,state.region.cluster)}${selectFromOptions('region-sort','Urutkan Berdasarkan',p.options.sortProfile,state.region.sort)}</div>
      ${p.unmatchedRegions?.length?`<details class="warning-box"><summary>${p.unmatchedRegions.length} wilayah tidak terpasangkan dengan data cluster</summary><div style="margin-top:7px">${escapeHtml(p.unmatchedRegions.join(', '))}</div></details>`:''}
      ${renderKpis(p.kpi||[])}<div style="height:14px"></div>
      ${chartCard(p.stackedChart.title,p.stackedChart.subtitle,'region-stacked','region-card')}
      <div class="region-two-col" style="margin-top:16px"><div>${chartCard(p.clusterDominantChart.title,p.clusterDominantChart.subtitle,'region-cluster-chart','region-card')}<div class="methodology-box"><div class="methodology-title">${escapeHtml(meth.title||'')}</div><div class="methodology-body">${markdownBold(meth.intro||'')}<div style="font-weight:700;margin-top:8px">${escapeHtml(meth.variablesTitle||'')}</div><ul class="variable-list">${(meth.variables||[]).map(v=>`<li><b>${escapeHtml(v.name)}</b> — ${escapeHtml(v.desc)}</li>`).join('')}</ul></div></div>${regionDetailsHtml(p.clusterDetails,false)}</div><div>${chartCard(p.cultureDominantChart.title,p.cultureDominantChart.subtitle,'region-culture-chart','region-card')}${regionDetailsHtml(p.cultureDetails,true)}</div></div>
      <div class="region-two-col" style="margin-top:16px"><div class="insight-box"><div class="insight-box-header"><i class="fa-solid fa-chart-line"></i>${escapeHtml(p.clusterInsight.title)}</div><div class="insight-box-body">${insightItemsHtml(p.clusterInsight)}</div></div><div class="reco-box"><div class="reco-box-header"><i class="fa-solid fa-people-group"></i>${escapeHtml(p.cultureInsight.title)}</div><div class="reco-box-body">${insightItemsHtml(p.cultureInsight)}</div></div></div>
      </section>`;
    ['region-h','region-cluster','region-sort'].forEach(id=>document.getElementById(id).addEventListener('change',async()=>{state.region.h=document.getElementById('region-h').value;state.region.cluster=document.getElementById('region-cluster').value;state.region.sort=document.getElementById('region-sort').value;await renderRegionPage()}));
    renderRegionStacked('region-stacked',p.stackedChart);renderDominantPlot('region-cluster-chart',p.clusterDominantChart);renderDominantPlot('region-culture-chart',p.cultureDominantChart);window.scrollTo({top:0,behavior:'auto'});
  }catch(err){document.getElementById('app').innerHTML=infoBox(err.message,'error')}
  finally{setLoading(false)}
}

/* ============================================================
 * FRAMEWORK
 * ============================================================ */
function frameworkStepHtml(step,profiling=false){
  const items=(step.items||[]).map(it=>{
    if(profiling){return `<div class="fw-item"><div class="fw-mini-icon">${escapeHtml(step.icon||'•')}</div><div><b>${escapeHtml(it[0])}</b><span>${escapeHtml(it[1])}</span></div></div>`}
    return `<div class="fw-item"><div class="fw-mini-icon"><i class="${escapeHtml(it[0])}"></i></div><div><b>${escapeHtml(it[1])}</b><span>${escapeHtml(it[2])}</span></div></div>`;
  }).join('');
  return `<article class="fw-step"><div class="fw-step-head"><span>${escapeHtml(step.no)}</span><h3>${step.title}</h3></div><div class="fw-step-body">${items}<div class="fw-output"><b>${escapeHtml(step.output_label||'OUTPUT')}</b><ul>${(step.output||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div></div></article>`;
}
async function renderFrameworkPage(){
  setLoading(true);
  try{
    const r=await apiGet('framework'), f=r.framework||r;
    const matrixSection=f.matrixSection||{};
    const profilingSection=f.profilingSection||{};
    const insightSection=f.insightSection||{};
    const matrixSteps=matrixSection.steps||[];
    const profilingSteps=profilingSection.steps||[];
    const insights=insightSection.items||[];
    document.getElementById('app').innerHTML=`<div class="fw-shell"><h2 class="fw-title">${escapeHtml(matrixSection.title||'')}</h2><div class="fw-subtitle">${escapeHtml(matrixSection.subtitle||'')}</div><div class="fw-grid fw-grid-a">${matrixSteps.map(x=>frameworkStepHtml(x,false)).join('')}</div></div>
      <div class="fw-shell"><h2 class="fw-title">${escapeHtml(profilingSection.title||'')}</h2><div class="fw-subtitle fw-subtitle-gmm">${profilingSection.subtitleHtml||''}</div><div class="fw-grid fw-grid-b">${profilingSteps.map(x=>frameworkStepHtml(x,true)).join('')}</div></div>
      ${insights.length?`<div class="fw-shell"><h2 class="fw-title">${escapeHtml(insightSection.title||'')}</h2><div class="fw-insight-grid">${insights.map(x=>`<article class="fw-insight" style="--c:${escapeHtml(x.color)}"><div class="fw-insight-icon">${escapeHtml(x.icon)}</div><div class="fw-insight-title">${escapeHtml(x.title)}</div><div class="fw-insight-desc">${escapeHtml(x.desc)}</div></article>`).join('')}</div></div>`:''}`;
    window.scrollTo({top:0,behavior:'auto'});
  }catch(err){document.getElementById('app').innerHTML=infoBox(err.message,'error')}
  finally{setLoading(false)}
}

/* ============================================================
 * NAVIGATION + BOOTSTRAP
 * ============================================================ */
async function renderActivePage(){
  const unit=UNIT_BY_PAGE[state.activePage];
  if(unit)return renderUnitPage(unit);
  if(state.activePage==='PROFIL WILAYAH')return renderRegionPage();
  if(state.activePage==='FRAMEWORK')return renderFrameworkPage();
  return renderUnitPage('sales');
}
document.getElementById('refreshBtn').addEventListener('click',async()=>{
  state.lastUpdate=new Date();
  Object.values(state.unit).forEach(s=>{s.heatmap=null});
  try{setLoading(true);state.config=await apiGet('config');updateLastUpdate();renderPageSelector();await renderActivePage()}catch(err){document.getElementById('app').innerHTML=infoBox(err.message,'error')}finally{setLoading(false)}
});
document.getElementById('resetBtn').addEventListener('click',async()=>{resetActivePageState();await renderActivePage()});

async function init(){
  renderPageSelector(); updateLastUpdate();
  if(!isConfigured()){
    document.getElementById('app').innerHTML=`<section class="section">${infoBox('Frontend sudah lengkap. Sebelum dijalankan, ganti GAS_EXEC_URL di bagian awal index.html dengan URL Web App Apps Script dari Kode.gs yang berakhiran /exec.','warning')}</section>`;
    return;
  }
  setLoading(true);
  try{state.config=await apiGet('config');updateLastUpdate();renderPageSelector();await renderActivePage()}
  catch(err){document.getElementById('app').innerHTML=infoBox(err.message,'error')}
  finally{setLoading(false)}
}
init();
</script>
</body>
</html>
